html{

body{

}

.search-box button{

  border-radius:12px;
}

/* MAIN */

main{
  padding-bottom:50px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:-40px;
}

.stat{
  background:var(--card);
  padding:22px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  border:1px solid var(--border);
}

.stat b{
  display:block;
  font-size:25px;
  color:var(--primary);
}

.stat span{
  color:var(--muted);
  font-size:14px;
}

.section{
  margin-top:50px;
}

.section h2{
  font-size:28px;
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:25px;
}

/* CARDS */

.card{
  background:var(--card);
  padding:24px;
  border-radius:20px;
  border:1px solid var(--border);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.icon{
  font-size:36px;
}

.card h3{
  margin:14px 0 8px;
}

.card p{
  color:var(--muted);
  line-height:1.6;
}

  font-weight:bold;
}

<script>

/* الوضع الليلي */

function toggleDark(){
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "zentroTheme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );
}

function loadTheme(){
  const theme = localStorage.getItem("zentroTheme");

  if(theme === "dark"){
    document.body.classList.add("dark");
  }
}


/* عداد الكلمات */

function countText(){

  const text =
    document.getElementById("textInput").value.trim();

  const characters =
    document.getElementById("textInput").value.length;

  const words =
    text === ""
      ? 0
      : text.split(/\s+/).length;

  document.getElementById("wordResult").textContent =
    "عدد الكلمات: " +
    words +
    " | عدد الحروف: " +
    characters;
}


/* مولد كلمة المرور */

function generatePassword(){

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

  let password = "";

  for(let i = 0; i < 14; i++){
    password += characters.charAt(
      Math.floor(
        Math.random() * characters.length
      )
    );
  }

  document.getElementById("passwordResult").textContent =
    password;
}


function copyPassword(){

  const password =
    document.getElementById("passwordResult").textContent;

  if(
    password &&
    password !== "اضغط على إنشاء كلمة مرور"
  ){

    navigator.clipboard.writeText(password);

    alert("تم نسخ كلمة المرور ✅");
  }
}


/* الآلة الحاسبة */

function calculate(){

  const input =
    document.getElementById("calcInput").value;

  try{

    if(
      !/^[0-9+\-*/().\s]+$/.test(input)
    ){
      throw new Error();
    }

    const result =
      Function(
        '"use strict"; return (' +
        input +
        ')'
      )();

    document.getElementById("calcResult").textContent =
      "النتيجة: " + result;

  }catch(error){

    document.getElementById("calcResult").textContent =
      "❌ أدخل عملية حسابية صحيحة";
  }
}


/* حاسبة العمر */

function calculateAge(){

  const birth =
    document.getElementById("birthDate").value;

  if(!birth){

    document.getElementById("ageResult").textContent =
      "❌ اختر تاريخ الميلاد";

    return;
  }

  const birthDate =
    new Date(birth);

  const today =
    new Date();

  let age =
    today.getFullYear() -
    birthDate.getFullYear();

  const monthDifference =
    today.getMonth() -
    birthDate.getMonth();

  if(
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      today.getDate() <
      birthDate.getDate()
    )
  ){
    age--;
  }

  document.getElementById("ageResult").textContent =
    "عمرك: " +
    age +
    " سنة 🎉";
}


/* رقم عشوائي */

function generateRandom(){

  const number =
    Math.floor(
      Math.random() * 1000000
    );

  document.getElementById("randomResult").textContent =
    "🎲 " + number;
}


/* مولد اللون */

function generateColor(){

  const color =
    "#" +
    Math.floor(
      Math.random() *
      16777215
    )
    .toString(16)
    .padStart(6,"0");

  const result =
    document.getElementById("colorResult");

  result.textContent =
    color;

  result.style.background =
    color;

  result.style.color =
    "#ffffff";
}


/* مولد الهاشتاغ */

function generateHashtags(){

  const topic =
    document
      .getElementById("hashtagInput")
      .value
      .trim()
      .replace(/\s+/g,"");

  if(!topic){

    document.getElementById("hashtagResult").textContent =
      "❌ اكتب موضوعاً أولاً";

    return;
  }

  const hashtags =
    "#" + topic +
    " #" + topic + "2026" +
    " #" + topic + "Daily" +
    " #Trending" +
    " #ZENTRO";

  document.getElementById("hashtagResult").textContent =
    hashtags;
}


/* رابط واتساب */

function generateWhatsApp(){

  let number =
    document
      .getElementById("whatsappNumber")
      .value
      .replace(/\D/g,"");

  const message =
    document
      .getElementById("whatsappMessage")
      .value;

  if(!number){

    document.getElementById("whatsappResult").textContent =
      "❌ أدخل رقم الهاتف";

    return;
  }

  const link =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message);

  const result =
    document.getElementById("whatsappResult");

  result.innerHTML =
    '<a href="' +
    link +
    '" target="_blank">' +
    link +
    "</a>";
}


/* حاسبة الربح */

function calculateProfit(){

  const cost =
    parseFloat(
      document.getElementById("costPrice").value
    );

  const selling =
    parseFloat(
      document.getElementById("sellingPrice").value
    );

  if(
    isNaN(cost) ||
    isNaN(selling)
  ){

    document.getElementById("profitResult").textContent =
      "❌ أدخل الأسعار";

    return;
  }

  const profit =
    selling - cost;

  const margin =
    cost !== 0
      ? (profit / cost) * 100
      : 0;

  document.getElementById("profitResult").textContent =
    "الربح: " +
    profit.toFixed(2) +
    " | هامش الربح: " +
    margin.toFixed(2) +
    "%";
}


/* حاسبة الخصم */

function calculateDiscount(){

  const price =
    parseFloat(
      document.getElementById("originalPrice").value
    );

  const discount =
    parseFloat(
      document.getElementById("discountPercent").value
    );

  if(
    isNaN(price) ||
    isNaN(discount)
  ){

    document.getElementById("discountResult").textContent =
      "❌ أدخل السعر ونسبة الخصم";

    return;
  }

  const amount =
    price * discount / 100;

  const finalPrice =
    price - amount;

  document.getElementById("discountResult").textContent =
    "قيمة الخصم: " +
    amount.toFixed(2) +
    " | السعر بعد الخصم: " +
    finalPrice.toFixed(2);
}


/* البحث */

function searchTools(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  const tools =
    document.querySelectorAll(
      ".tool-card"
    );

  tools.forEach(function(tool){

    const text =
      tool.textContent.toLowerCase();

    if(
      text.includes(search)
    ){
      tool.style.display =
        "block";
    }else{
      tool.style.display =
        "none";
    }
  });
}


/* العودة للأعلى */

function scrollToTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


window.addEventListener(
  "scroll",
  function(){

    const button =
      document.getElementById("topButton");

    if(
      window.scrollY > 300
    ){
      button.style.display =
        "block";
    }else{
      button.style.display =
        "none";
    }
  }
);


/* اللغات */

const translations = {

  ar:{
    heroTitle:
      "كل أدواتك في مكان واحد ⚡",

    heroText:
      "ZENTRO منصة عالمية للأدوات الرقمية المجانية والمميزة التي تعمل مباشرة من المتصفح."
  },

  en:{
    heroTitle:
      "All your tools in one place ⚡",

    heroText:
      "ZENTRO is a global platform for free and premium digital tools that work directly in your browser."
  }
};


function changeLanguage(){

  const language =
    document
      .getElementById("languageSelect")
      .value;

  localStorage.setItem(
    "zentroLanguage",
    language
  );

  const data =
    translations[language];

  document
    .getElementById("heroTitle")
    .textContent =
    data.heroTitle;

  document
    .getElementById("heroText")
    .textContent =
    data.heroText;

  document.documentElement.lang =
    language;

  document.documentElement.dir =
    language === "ar"
      ? "rtl"
      : "ltr";
}


function loadLanguage(){

  const language =
    localStorage.getItem(
      "zentroLanguage"
    ) || "ar";

  document
    .getElementById("languageSelect")
    .value =
    language;

  changeLanguage();
}


loadTheme();
loadLanguage();

</script>
